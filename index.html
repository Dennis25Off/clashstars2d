    <!-- Suppress ambient iframe WebSocket connection notices as HMR is disabled in AI Studio preview -->
    <script>
      (function() {
        // Intercept console.error to filter out Vite WebSocket connection notices
        const origError = console.error;
        console.error = function(...args) {
          try {
            const str = args.map(function(a) {
              return a instanceof Error ? (a.message + ' ' + (a.stack || '')) : String(a);
            }).join(' ');
            if (str.includes('WebSocket') || str.includes('websocket') || str.includes('without opened') || str.includes('connection lost')) {
              return;
            }
          } catch (_) {}
          return origError.apply(console, args);
        };

        // Complete robust Mock WebSocket to satisfy Vite client without attempting failing socket handshakes
        if (typeof window !== 'undefined') {
          class FakeWebSocket extends EventTarget {
            static CONNECTING = 0;
            static OPEN = 1;
            static CLOSING = 2;
            static CLOSED = 3;

            CONNECTING = 0;
            OPEN = 1;
            CLOSING = 2;
            CLOSED = 3;

            constructor(url, protocols) {
              super();
              this.url = String(url || '');
              this.protocols = protocols || '';
              this.readyState = 1; // WebSocket.OPEN
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = '';
              this.binaryType = 'blob';

              this.onopen = null;
              this.onclose = null;
              this.onerror = null;
              this.onmessage = null;

              setTimeout(() => {
                if (this.readyState === 1) {
                  const ev = new Event('open');
                  if (typeof this.onopen === 'function') {
                    try { this.onopen(ev); } catch (_) {}
                  }
                  this.dispatchEvent(ev);
                }
              }, 10);
            }

            send() {}

            close(code, reason) {
              this.readyState = 3; // CLOSED
              const ev = new CloseEvent('close', {
                wasClean: true,
                code: code || 1000,
                reason: reason || 'Normal Closure',
              });
              if (typeof this.onclose === 'function') {
                try { this.onclose(ev); } catch (_) {}
              }
              this.dispatchEvent(ev);
            }
          }

          window.WebSocket = FakeWebSocket;
        }

        window.addEventListener('error', function(e) {
          const msg = e && (e.message || (e.error && e.error.message));
          if (msg && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('without opened') || msg.includes('connection lost'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const msg = e && e.reason && (String(e.reason.message || e.reason));
          if (msg && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('without opened') || msg.includes('connection lost'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
