<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0b0f19" />
    </radialGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="starRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.4" stroke-dasharray="16 10"/>
  <!-- Star shape -->
  <g filter="url(#dropShadow)">
    <polygon points="256,50 316,190 466,200 350,300 385,450 256,370 127,450 162,300 46,200 196,190"
      fill="url(#starGold)" stroke="url(#starRim)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Face / Skull emblem in the star -->
    <ellipse cx="210" cy="245" rx="20" ry="26" fill="#1e1b4b" transform="rotate(-5 210 245)" />
    <ellipse cx="302" cy="245" rx="20" ry="26" fill="#1e1b4b" transform="rotate(5 302 245)" />
    <circle cx="216" cy="238" r="7" fill="#ffffff" />
    <circle cx="308" cy="238" r="7" fill="#ffffff" />
    <!-- Cheerful aggressive grin -->
    <path d="M 195 295 Q 256 345 317 295 Q 256 320 195 295 Z" fill="#1e1b4b" stroke="#713f12" stroke-width="4"/>
    <path d="M 230 304 L 234 316" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 256 307 L 256 318" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 282 304 L 278 316" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Crossed cartoon blasters behind/bottom -->
  <circle cx="256" cy="460" r="28" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
  <text x="256" y="468" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="22" fill="#ffffff">CS</text>
</svg>
